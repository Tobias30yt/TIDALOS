---
modules-search: [ local ]
branding: tidalos
prompt-install: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
sequence:
  - show: welcome
  - show: locale
  - show: keyboard
  - show: partition
  - show: users
  - show: summary
  - exec: partition
  - exec: mount
  - exec: unpackfs
  - exec: shellprocess
  - exec: machineid
  - exec: fstab
  - exec: locale
  - exec: keyboard
  - exec: localecfg
  - exec: users
  - exec: displaymanager
  - exec: networkcfg
  - exec: hwclock
  - exec: initramfs
  - exec: grubcfg
  - exec: bootloader
  - exec: umount
  - show: finished
